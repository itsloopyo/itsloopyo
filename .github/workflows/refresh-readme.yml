name: refresh-readme

# The "New in the past 30 days" list is a window over the calendar, so it
# goes stale on days when nothing is published and nobody runs
# `pixi run update-metadata`. Regenerate it nightly from the live catalog
# (lopari.app/mods.json, public). The mod table below it comes from the same
# run, so it also picks up the pins update-pins.yml refreshes hourly.
#
# lopari.app is checked out next to this repo because generate-readme.mjs
# writes ../itsloopyo/README.md relative to itself, the same layout a local
# run uses. Only this repo is written to, with its own GITHUB_TOKEN.
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: false

jobs:
  readme:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: main
          path: itsloopyo

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: itsloopyo/lopari.app
          ref: main
          path: lopari.app

      - uses: prefix-dev/setup-pixi@5185adfbffb4bd703da3010310260805d89ebb11 # v0.9.6
        with:
          manifest-path: lopari.app/pixi.toml

      - name: Regenerate, commit and push if the README moved
        run: |
          cd itsloopyo
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A local `pixi run update-metadata` can push a README commit while
          # this runs. Regenerate against the new tip rather than rebasing a
          # generated file.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            pixi run --manifest-path ../lopari.app/pixi.toml readme
            if git diff --quiet README.md; then
              echo "README unchanged - skipping commit."
              exit 0
            fi
            git add README.md
            git commit -m "readme: nightly refresh of the mod lists"
            if git push; then exit 0; fi
            echo "Push rejected by a concurrent README commit - regenerating (attempt $attempt)."
          done
          echo "::error::Could not land the README refresh after 3 attempts."
          exit 1
